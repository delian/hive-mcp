[project]
name = "hive-hooks"
version = "0.1.0"
description = "Connect coding agents (Claude Code hooks, AGENTS.md) to a hive-mcp knowledge base"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "typer>=0.27.3",
]

[project.scripts]
hive-hooks = "hive_hooks.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
