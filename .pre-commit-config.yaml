repos:
  - repo: local
    hooks:
      - {id: ruff-format, name: ruff format, entry: uv run ruff format, language: system, types: [python]}
      - {id: ruff, name: ruff check, entry: uv run ruff check --fix, language: system, types: [python]}
      - {id: mypy, name: mypy, entry: uv run mypy src, language: system, pass_filenames: false}
      - {id: file-size, name: file size guard, entry: uv run python scripts/check_file_size.py src, language: system, pass_filenames: false}
