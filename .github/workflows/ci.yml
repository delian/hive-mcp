name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # weekly: new advisories can appear without any change of ours
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HIVE_TEST_PG_DSN: host=localhost port=5432 dbname=postgres user=postgres password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: pg_dump/pg_restore of the same major version as the service container (16)
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get install -y --no-install-recommends postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src clients/hooks/src
      - run: uv run python scripts/check_file_size.py src clients/hooks/src
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Known vulnerabilities in the locked dependencies
        run: uv run pip-audit

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: The slim hooks client builds, installs alone and runs
        run: |
          uv build --package hive-hooks --out-dir dist-client
          uv venv /tmp/client-venv
          uv pip install --python /tmp/client-venv/bin/python dist-client/*.whl
          /tmp/client-venv/bin/python -c "import hive_hooks.cli, sys; assert 'hive_mcp' not in sys.modules"
          cd "$(mktemp -d)" && /tmp/client-venv/bin/hive-hooks hooks install --scope project --dry-run

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image with the offline model baked in
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hive-mcp:ci
          build-args: BAKE_MODEL=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (start, call tools, restart, data survives, clean shutdown)
        run: scripts/smoke_docker.sh hive-mcp:ci
      - name: One container only - a replaced container comes back with its data, two cannot overlap
        run: scripts/smoke_single_container.sh hive-mcp:ci
      - name: Image with PostgreSQL inside - the same promise with the external profile in one container
        run: |
          docker build --build-arg WITH_POSTGRES=true -t hive-mcp:pg .
          SMOKE_ARGS='-e HIVE_EMBEDDED_POSTGRES=true' scripts/smoke_single_container.sh hive-mcp:pg
      - name: Smoke test with the real offline embedder
        run: HIVE_EMBEDDER=onnx scripts/smoke_docker.sh hive-mcp:ci
      - name: Scan the image for known vulnerabilities (fixable high/critical only)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress hive-mcp:ci
      - name: Image built with OCR has Tesseract and Poppler, and the server starts with HIVE_OCR=true
        run: |
          docker build --build-arg WITH_OCR=true -t hive-mcp:ocr .
          docker run --rm hive-mcp:ocr sh -c 'tesseract --list-langs | grep -qx eng && pdftoppm -v'
          docker run --rm -e HIVE_OCR=true -e HIVE_DATA_DIR=/tmp/d hive-mcp:ocr \
            python -c "import asyncio; from hive_mcp.bootstrap import build_services; from hive_mcp.config import Settings; asyncio.run(build_services(Settings()))"
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=x TUNNEL_TOKEN=x TS_AUTHKEY=x docker compose --profile postgres --profile cloudflare --profile tailscale config -q

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - run: az bicep build --file deploy/azure/single.bicep --stdout > /dev/null
      - run: az bicep build-params --file deploy/azure/main.bicepparam --stdout > /dev/null
  mutation:
    # Slow and only for the weekly run (or by hand): a surviving mutant is a change to the
    # security-critical code that no test notices. See docs/HARDENING.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: scripts/mutation.sh
