name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Version in the files matches the tag
        run: |
          for f in pyproject.toml clients/hooks/pyproject.toml; do
            grep -q "^version = \"${GITHUB_REF_NAME#v}\"" "$f" || { echo "$f is not at ${GITHUB_REF_NAME#v}"; exit 1; }
          done
      - run: uv build --package hive-mcp --out-dir dist
      - run: uv build --package hive-hooks --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
  pypi:
    # Opt in: set the repository variable PUBLISH_TO_PYPI=true and add this repository and
    # workflow as a trusted publisher on pypi.org (no token is stored).
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
