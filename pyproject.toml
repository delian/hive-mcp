[project]
name = "hive-mcp"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hive-hooks",
    "httpx>=0.27",
    "mcp>=2,<3",
    "numpy>=2",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.8",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
hive = "hive_mcp.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]>=3.2",
]
documents = [
    "pypdf>=5.0",
]
local-embeddings = [
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]
lancedb = [
    "lancedb>=0.40",
]

[tool.uv.workspace]
members = ["clients/hooks"]

[tool.uv.sources]
hive-hooks = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "duckdb>=2.0.0",
    "lancedb>=0.40.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
]
dev = [
    "httpx>=0.28.1",
    "pypdf>=5.0",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
    "hypothesis>=6.170.8",
    "mypy>=2.4.0",
    "psycopg[binary,pool]>=3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pip-audit>=2.10.1",
    "pillow>=13.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["bench"]  # TODO: lint-clean the benchmark harness

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "PL", "RUF", "TCH", "ANN"]

[tool.ruff.lint.per-file-ignores]
"src/hive_mcp/adapters/sqlite/*.py" = ["E501"]  # long SQL string literals read better unwrapped
"src/hive_mcp/adapters/postgres/*.py" = ["E501"]
# Tool signatures are the public API: many optional arguments are intended.
"src/hive_mcp/mcp_api/*.py" = ["E501"]  # agent-facing text is clearer unwrapped
"src/hive_mcp/security/oauth/*.py" = ["E501"]  # long RFC references and log formats read better unwrapped
"src/hive_mcp/webui/*.py" = ["E501"]  # inline HTML and CSS read better unwrapped
"clients/hooks/src/hive_hooks/cli.py" = ["E501"]  # CLI help and echo text reads better unwrapped
"clients/hooks/src/hive_hooks/install.py" = ["E501"]  # the agent-facing note is prose
"src/hive_mcp/mcp_api/tools.py" = ["PLR0913", "PLR0917"]
"tests/**" = ["S101", "PLR2004", "ANN", "S105", "S106", "E501"]  # fake secrets and long fixtures are fine in tests

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "pyarrow", "pyarrow.*", "lancedb", "lancedb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=hive_mcp --cov-report=term-missing"
timeout = 60  # a hung test fails after a minute instead of stalling CI
